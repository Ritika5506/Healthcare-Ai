version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: healthcare-federated-ai-backend:latest
    volumes:
      - ./backend/global_model.h5:/app/backend/global_model.h5:ro
      - ./backend/saved_model:/app/backend/saved_model:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: healthcare-federated-ai-frontend:latest
    ports:
      - "3000:80"
    restart: unless-stopped

# Optional: add a database, redis, or flwr server here if needed
